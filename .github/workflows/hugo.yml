# Build and deploy Hugo site to GitHub Pages
name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  delete-old-deployments:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      deployments: write
    steps:
      - name: Delete previous deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: 'github-pages' }
            );
            for (const d of deployments) {
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: d.id,
                  state: 'inactive',
                });
              } catch (e) {
                // already inactive or other
              }
              try {
                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: d.id,
                });
                console.log('Deleted deployment', d.id);
              } catch (e) {
                console.log('Could not delete deployment', d.id, e.message);
              }
            }
            console.log('Cleanup done. Total:', deployments.length);
